openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Digital products store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: checkout
    description: Checkout and payment operations
  - name: store
    description: Store meta operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products with prices
      parameters:
        - in: query
          name: category
          schema:
            type: string
          required: false
        - in: query
          name: featured
          schema:
            type: boolean
          required: false
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                required:
                  - data

  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /store/stats:
    get:
      operationId: getStoreStats
      tags: [store]
      summary: Get store stats (total products, categories, etc.)
      responses:
        "200":
          description: Store stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStats"

  /checkout/session:
    post:
      operationId: createCheckoutSession
      tags: [checkout]
      summary: Create a Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionBody"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /checkout/publishable-key:
    get:
      operationId: getPublishableKey
      tags: [checkout]
      summary: Get the Stripe publishable key for the frontend
      responses:
        "200":
          description: Publishable key
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishableKey:
                    type: string
                required:
                  - publishableKey

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Price:
      type: object
      properties:
        id:
          type: string
        unit_amount:
          type: number
          nullable: true
        currency:
          type: string
        recurring:
          type: object
          nullable: true
          properties:
            interval:
              type: string
            interval_count:
              type: number
        active:
          type: boolean
      required:
        - id
        - currency
        - active

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
        images:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
        prices:
          type: array
          items:
            $ref: "#/components/schemas/Price"
      required:
        - id
        - name
        - active
        - images
        - prices

    StoreStats:
      type: object
      properties:
        totalProducts:
          type: number
        categories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: number
            required:
              - name
              - count
        featuredCount:
          type: number
      required:
        - totalProducts
        - categories
        - featuredCount

    CreateCheckoutSessionBody:
      type: object
      properties:
        priceId:
          type: string
        successUrl:
          type: string
        cancelUrl:
          type: string
      required:
        - priceId
        - successUrl
        - cancelUrl

    CheckoutSessionResponse:
      type: object
      properties:
        url:
          type: string
        sessionId:
          type: string
      required:
        - url
        - sessionId

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
