# Render blueprint: one web service (store + API) and one Postgres database.
databases:
  - name: arunwebsite-db
    plan: free

services:
  - type: web
    name: arunwebsite
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arunwebsite-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
